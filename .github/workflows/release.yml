name: Build & Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del instalador (ej: 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar versión
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Escribir versión en core/version.py
        shell: powershell
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          (Get-Content core\version.py) `
            -replace '__version__ = ".*"', "__version__ = `"$v`"" |
          Set-Content core\version.py

      - name: Build con PyInstaller
        run: pyinstaller build/alertas.spec --noconfirm --clean

      - name: Descargar FFmpeg para bundlear en instalador
        shell: powershell
        run: |
          $zip  = "$env:TEMP\ffmpeg.zip"
          $dest = "$env:TEMP\ffmpeg-extract"
          $url  = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"

          Write-Host "Descargando FFmpeg desde $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          Write-Host "Extrayendo..."
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # Buscar ffmpeg.exe dentro de la carpeta bin/ extraída
          $ffmpegExe = Get-ChildItem -Path $dest -Recurse -Filter "ffmpeg.exe" |
                       Where-Object { $_.DirectoryName -match "\\bin$" } |
                       Select-Object -First 1

          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe no encontrado en el zip descargado"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "build\bin" | Out-Null
          Copy-Item $ffmpegExe.FullName "build\bin\ffmpeg.exe"
          $size = [math]::Round((Get-Item "build\bin\ffmpeg.exe").Length / 1MB, 1)
          Write-Host "FFmpeg copiado a build\bin\ffmpeg.exe ($size MB)"

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Actualizar versión en instalador
        shell: powershell
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          (Get-Content build\setup.iss) `
            -replace '#define AppVersion\s+"[^"]*"', "#define AppVersion `"$v`"" |
          Set-Content build\setup.iss

      - name: Construir instalador (.exe)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/installer/*.exe
          retention-days: 30

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', steps.ver.outputs.VERSION) }}
          name: "Goujana Agenda v${{ steps.ver.outputs.VERSION }}"
          files: dist/installer/*.exe
          body: |
            ## Novedades v${{ steps.ver.outputs.VERSION }}

            - **Barra de acciones visible en el dashboard** — las opciones de Actualizar, Grabar pantalla, Configuración, Probar alerta y Actualizar app ahora son botones siempre visibles, sin menú desplegable
            - **Barra de micrófono en tiempo real** — usa `IAudioMeterInformation` de Windows Core Audio para mostrar el nivel real del micrófono
            - **Fix: micrófonos detectados correctamente** — parser dshow actualizado para FFmpeg 8.x
            - **Fix: audio capturado con dshow** — DirectShow reemplaza WASAPI (no incluido en essentials)
            - **Fix: FFmpeg bundled detectado correctamente** — busca `ffmpeg.exe` en `bin\` antes del PATH

            ## Descarga e instalación

            1. Descarga `Alertas_de_Calendarios_Setup.exe`
            2. Ejecuta el instalador (requiere permisos de administrador)
            3. FFmpeg se instala y configura automáticamente
            4. La app se inicia en la bandeja del sistema (system tray)

            ## Requisitos

            - Windows 10 o superior (64-bit)
            - Conexión a internet para transcripción (API key gratuita en console.groq.com)
